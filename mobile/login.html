<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン | 現地キーボックス</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="loginBox">

        <div class="lockIcon">
            🔒
        </div>

        <h1>現地キーボックス</h1>

        <p class="message">

            パスワードを入力してください

        </p>

        <input
            type="password"
            id="password"
            maxlength="4"
            inputmode="numeric"
            placeholder="••••"
            autocomplete="off">

        <button id="loginButton">

            ログイン

        </button>

        <div id="errorMessage"></div>

        <div class="footer">

            ちんたい　キーボックス設置場所検索

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
